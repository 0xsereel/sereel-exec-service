# Scheduled events that move gold. ONLY entries read directly from the issuing agency's own schedule page on `verified_on`;
# each carries its source_url. Add an event only after checking that page; never from memory or a third-party calendar.
# FOMC: the decision is published on the second meeting day (the Fed's page lists the two-day range; no time is entered here
# because the page read did not state one, so the whole day in America/New_York counts as the event window).
# CPI: BLS lists the release at 08:30 AM (Eastern).
